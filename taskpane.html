<script>
const EX=7,W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',
PK='http://schemas.microsoft.com/office/2006/xmlPackage',
RT='http://schemas.openxmlformats.org/officeDocument/2006/relationships',
PR='http://schemas.openxmlformats.org/package/2006/relationships';
const $=id=>document.getElementById(id),say=t=>$('msg').textContent=t;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const b64=s=>btoa(unescape(encodeURIComponent(s)));

/* ---------- LaTeX -> SVG (+PNG fallback) ---------- */
function toPng(svg,w,h){return new Promise((ok,no)=>{const i=new Image();
 i.onload=()=>{const c=document.createElement('canvas');c.width=w*3;c.height=h*3;
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/png').split(',')[1]);};
 i.onerror=()=>no(new Error('PNG fallback failed'));
 i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
/* Fractions/binomials always in display style, so nested fractions keep full size.
   The stored TeX (alt text) is left untouched; only the rendering is adjusted. */
const PAD=3,norm=t=>t.replace(/\\(?:frac|tfrac)(?![a-zA-Z])/g,'\\dfrac').replace(/\\binom(?![a-zA-Z])/g,'\\dbinom');
async function render(tex){
 const n=await MathJax.tex2svgPromise(norm(tex),{display:false}),s=n.querySelector('svg');
 if(s.querySelector('[data-mml-node="merror"]'))throw new Error('Invalid LaTeX');
 const w0=parseFloat(s.getAttribute('width'))*EX,h0=parseFloat(s.getAttribute('height'))*EX,
  va=parseFloat(s.style.verticalAlign)||0,vb=s.getAttribute('viewBox').split(/[\s,]+/).map(Number),
  pu=PAD*vb[2]/w0,box=[vb[0]-pu,vb[1]-pu,vb[2]+2*pu,vb[3]+2*pu],
  w=Math.round(w0)+2*PAD,h=Math.round(h0)+2*PAD;
 /* near-invisible background box: makes the whole rectangle clickable in Word */
 s.setAttribute('viewBox',box.join(' '));
 const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
 bg.setAttribute('x',box[0]);bg.setAttribute('y',box[1]);bg.setAttribute('width',box[2]);bg.setAttribute('height',box[3]);
 bg.setAttribute('fill','#ffffff');bg.setAttribute('fill-opacity','0.01');
 s.insertBefore(bg,s.firstChild);
 s.setAttribute('width',w+'px');s.setAttribute('height',h+'px');s.removeAttribute('style');
 const svg=new XMLSerializer().serializeToString(s).replace(/currentColor/g,'#000000');
 return{svg,png:await toPng(svg,w,h),w,h,pos:Math.round((va*EX-PAD)*1.5)};
}

/* ---------- OOXML helpers ---------- */
function drawing(tex,w,h,id,rp,rs){const cx=w*9525,cy=h*9525;

const part=(n,t,x,bin)=>`<pkg:part pkg:name="${n}" pkg:contentType="${t}"${bin?' pkg:compression="store"':''}>${bin?`<pkg:binaryData>${x}</pkg:binaryData>`:`<pkg:xmlData>${x}</pkg:xmlData>`}</pkg:part>`;
const imgParts=(k,r)=>part(`/word/media/eq${k}.png`,'image/png',r.png,1)+part(`/word/media/eq${k}.svg`,'image/svg+xml',b64(r.svg),1);
function pkgFor(r,tex){
 const rels=`<Relationships xmlns="${PR}"><Relationship Id="rIdP" Type="${RT}/image" Target="media/eqx.png"/><Relationship Id="rIdS" Type="${RT}/image" Target="media/eqx.svg"/></Relationships>`;
 const run=`<w:r>${r.pos?`<w:rPr><w:position w:val="${r.pos}"/></w:rPr>`:''}${drawing(tex,r.w,r.h,Date.now()%1e6,'rIdP','rIdS')}</w:r>`;
 return `<pkg:package xmlns:pkg="${PK}">`
  +part('/_rels/.rels','application/vnd.openxmlformats-package.relationships+xml',`<Relationships xmlns="${PR}"><Relationship Id="rId1" Type="${RT}/officeDocument" Target="word/document.xml"/></Relationships>`)
  +part('/word/_rels/document.xml.rels','application/vnd.openxmlformats-package.relationships+xml',rels)
  +part('/word/document.xml','application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml',`<w:document xmlns:w="${W}"><w:body><w:p>${run}</w:p></w:body></w:document>`)
  +part('/word/media/eqx.png','image/png',r.png,1)+part('/word/media/eqx.svg','image/svg+xml',b64(r.svg),1)+'</pkg:package>';}

/* ---------- MTEF v5 (MathType binary) -> LaTeX, best effort ---------- */
const G=['alpha','beta','gamma','delta','varepsilon','zeta','eta','theta','iota','kappa','lambda','mu','nu','xi','o','pi','rho','varsigma','sigma','tau','upsilon','varphi','chi','psi','omega'],
GU=['A','B','\\Gamma','\\Delta','E','Z','H','\\Theta','I','K','\\Lambda','M','N','\\Xi','O','\\Pi','P','','\\Sigma','T','\\Upsilon','\\Phi','X','\\Psi','\\Omega'],
SYM={0xb1:'\\pm',0xd7:'\\times',0xf7:'\\div',0x2264:'\\le',0x2265:'\\ge',0x2260:'\\ne',0x2248:'\\approx',0x221e:'\\infty',0x2192:'\\to',0x2190:'\\leftarrow',0x21d2:'\\Rightarrow',0x2211:'\\sum',0x220f:'\\prod',0x222b:'\\int',0x2202:'\\partial',0x2212:'-',0x22c5:'\\cdot',0x2026:'\\ldots',0x2208:'\\in',0x2207:'\\nabla',0x2200:'\\forall',0x2203:'\\exists',0x222a:'\\cup',0x2229:'\\cap',0x2218:'\\circ',0x3d5:'\\phi',0x2261:'\\equiv',0x221d:'\\propto',0x2282:'\\subset',0x21d4:'\\Leftrightarrow',0xb0:'^\\circ',0x2032:"'",0x221a:'\\surd'},
ESC={9:'\\qquad ',123:'\\{',125:'\\}',92:'\\backslash',95:'\\_',94:'\\^{}',37:'\\%',38:'\\&',35:'\\#',36:'\\$',126:'\\sim'};

 else if(c>=0x391&&c<=0x3a9&&GU[c-0x391])r=GU[c-0x391];
 else r=SYM[c]||ESC[c]||String.fromCodePoint(c||63);
 return /^\\[a-zA-Z]+$/.test(r)?r+' ':r;}
const EMB={2:'dot',3:'ddot',4:'dddot',8:'tilde',9:'hat',11:'vec',16:'bar',17:'bar'};
function tmpl(s,v,c){const g=n=>c[n]||'',
 FEN={0:['\\langle','\\rangle'],1:['(',')'],2:['\\{','\\}'],3:['[',']'],4:['|','|'],5:['\\|','\\|'],6:['\\lfloor','\\rfloor'],7:['\\lceil','\\rceil'],8:['[',')'],9:['(',']']},
 OP={15:'\\int',16:'\\sum',17:'\\prod',18:'\\coprod',19:'\\bigcup',20:'\\bigcap'};
 if(FEN[s])return'\\left'+(v&1?FEN[s][0]:'.')+' '+g(0)+' \\right'+(v&2?FEN[s][1]:'.')+' ';
 if(OP[s])return OP[s]+(s>15?'\\limits':'')+(g(1)?'_{'+g(1)+'}':'')+(g(2)?'^{'+g(2)+'}':'')+' '+g(0);
 switch(s){
  case 10:return g(1)?`\\sqrt[${g(1)}]{${g(0)}}`:`\\sqrt{${g(0)}}`;
  case 11:return`{\\frac{${g(0)}}{${g(1)}}}`;
  case 12:return`\\underline{${g(0)}}`;case 13:return`\\overline{${g(0)}}`;
  case 14:return`\\xrightarrow[${g(1)}]{${g(0)}}`;
  case 23:return`\\mathop{${g(0)}}\\limits`+(g(1)?`_{${g(1)}}`:'')+(g(2)?`^{${g(2)}}`:'');
  case 24:return v&1?`\\underbrace{${g(0)}}_{${g(1)}}`:`\\overbrace{${g(0)}}^{${g(1)}}`;
  case 27:return`_{${g(0)||g(1)}}`;
  case 28:return`^{${g(1)||g(0)}}`;
  case 29:return`_{${g(0)}}^{${g(1)}}`;
  case 31:return`\\vec{${g(0)}}`;case 32:return`\\widetilde{${g(0)}}`;case 33:return`\\widehat{${g(0)}}`;
  case 37:return`\\boxed{${g(0)}}`;}

function mtefToTex(b){
 let i=b[0]|b[1]<<8;
 if(b[i]!==5)throw new Error('Unsupported MTEF version '+b[i]+' (only MathType 4+ / MTEF 5 is supported)');
 i+=5;while(b[i++]);i++;                        // header: 5 bytes, app key\0, options
 const u8=()=>b[i++],
 nud=()=>{const x=u8(),y=u8();if(x==128&&y==128)i+=4;},
 arr=()=>{let n=u8(),h=0;while(n>0){const x=b[i],nb=h?x&15:x>>4;if(h)i++;h^=1;if(nb==15)n--;}if(h)i++;},
 join=a=>{let o='',r='',m=0;const f=()=>{if(r){o+=(m==1?'\\text{':m==2?'\\mathrm{':'\\mathbf{')+r+'}';r='';}};
  for(const x of a){const k=x.f==1?1:x.f==2?2:x.f==7?3:0;
   if(k){if(m!=k)f();m=k;r+=x.t!=null?x.t:x.s;}else{f();m=0;o+=x.s;}}f();return o;};
 function list(){const a=[];
  while(i<b.length){const t=u8();
   switch(t){
    case 0:return a;
    case 1:{const o=u8();if(o&8)nud();if(o&4)i+=2;a.push({s:o&1?'':join(list())});break;}
    case 2:{const o=u8();if(o&8)nud();const f=u8()-128;let c=0,c8=0,c16=0;
     if(!(o&32))c=u8()|u8()<<8;if(o&4)c8=u8();if(o&16)c16=u8()|u8()<<8;
     c=c||c16||c8;let s=ch(c),pr='';
     if(o&1)for(;;){const e=u8();if(e==0)break;const eo=u8();if(eo&8)nud();const k=u8();
      if(k==5)pr+="'";else if(k==6)pr+="''";else if(EMB[k])s=`\\${EMB[k]}{${s}}`;}
     const raw=String.fromCodePoint(c||63);
     a.push({s:s+pr,f,t:/^[\x20-\x7e]$/.test(raw)&&!ESC[c]?raw:s});break;}
    case 3:{const o=u8();if(o&8)nud();const sel=u8();let v=u8();if(v&128)v=(v&127)|u8()<<8;u8();
     a.push({s:tmpl(sel,v,list().map(x=>x.s))});break;}
    case 4:{const o=u8();if(o&8)nud();i+=2;a.push({s:'\\begin{matrix}'+list().map(x=>x.s).join('\\\\')+'\\end{matrix}'});break;}
    case 5:{const o=u8();if(o&8)nud();i+=3;const R=u8(),C=u8();i+=Math.ceil((R+1)/4)+Math.ceil((C+1)/4);
     const k=list().map(x=>x.s),rows=[];for(let r=0;r<R;r++)rows.push(k.slice(r*C,r*C+C).join('&'));
     a.push({s:'\\begin{matrix}'+rows.join('\\\\')+'\\end{matrix}'});break;}
    case 6:{const o=u8();if(o&8)nud();i++;break;}
    case 7:i+=3*u8();break;
    case 8:i+=2;break;
    case 9:i+=u8()==101?2:1;break;
    case 10:case 11:case 12:case 13:case 14:break;
    case 15:i++;break;
    case 16:{const o=u8();i+=o&1?8:6;if(o&4)while(b[i++]);break;}
    case 17:i++;while(b[i++]);break;
    case 18:{i++;arr();arr();let n=u8();while(n--)if(u8())i++;break;}
    case 19:while(b[i++]);break;
    default:throw new Error('Unhandled MTEF record '+t+' at byte '+(i-1));}}
  return a;}
 return join(list());}

/* ---------- Convert MathType objects inside an OOXML package ---------- */
async function convertOoxml(x){
 const d=new DOMParser().parseFromString(x,'application/xml'),P={};
 for(const p of d.getElementsByTagName('pkg:part'))P[p.getAttribute('pkg:name')]=p;
 const rel=P['/word/_rels/document.xml.rels'].getElementsByTagName('Relationships')[0],map={};
 for(const r of rel.getElementsByTagName('Relationship'))map[r.getAttribute('Id')]=r.getAttribute('Target');
 let n=0;const errs=[],id0=Date.now()%1e6,all=[...d.getElementsByTagName('o:OLEObject')];
 if(!all.length)errs.push('no embedded OLE objects found in the selection');
 for(const o of all){
  if(!/^Equation\.(DSMT|3)/.test(o.getAttribute('ProgID')||'')){errs.push('skipped '+o.getAttribute('ProgID'));continue;}
  try{
   const bin=P['/word/'+map[o.getAttribute('r:id')]].getElementsByTagName('pkg:binaryData')[0].textContent.replace(/\s/g,'');
   const f=CFB.find(CFB.read(Uint8Array.from(atob(bin),c=>c.charCodeAt(0)),{type:'array'}),'Equation Native');
   const tex=mtefToTex(f.content),r=await render(tex),k=n;
   let ob=o;while(ob&&ob.nodeName!=='w:object')ob=ob.parentNode;
   const dr=new DOMParser().parseFromString(drawing(tex,r.w,r.h,id0+k,'rIdEP'+k,'rIdES'+k),'application/xml').documentElement;
   const nd=d.importNode(dr,true),rr=ob.parentNode;rr.replaceChild(nd,ob);
   if(r.pos&&rr.nodeName==='w:r'){let rp=[...rr.childNodes].find(q=>q.nodeName==='w:rPr');
    if(!rp){rp=d.createElementNS(W,'w:rPr');rr.insertBefore(rp,rr.firstChild);}
    const ps=d.createElementNS(W,'w:position');ps.setAttributeNS(W,'w:val',String(r.pos));
    const nx=[...rp.childNodes].find(q=>/^w:(sz|szCs|highlight|u|effect|bdr|shd|fitText|vertAlign|rtl|cs|em|lang|eastAsianLayout|specVanish|oMath)$/.test(q.nodeName));
    rp.insertBefore(ps,nx||null);}
   for(const[idn,ext]of[['rIdEP'+k,'png'],['rIdES'+k,'svg']]){
    const e=d.createElementNS(rel.namespaceURI,'Relationship');
    e.setAttribute('Id',idn);e.setAttribute('Type',RT+'/image');e.setAttribute('Target',`media/eq${k}.${ext}`);rel.appendChild(e);}
   const add=new DOMParser().parseFromString(`<pkg:package xmlns:pkg="${PK}">${imgParts(k,r)}</pkg:package>`,'application/xml');
   for(const c of [...add.documentElement.children])d.documentElement.appendChild(d.importNode(c,true));
   n++;
  }catch(e){errs.push(e.message);console.error(e);}
 }
 return{xml:new XMLSerializer().serializeToString(d),n,errs};
}

/* ---------- LaTeX -> MTEF v5 (MathType binary), subset ---------- */
const GRK={alpha:[0x3b1,'a'],beta:[0x3b2,'b'],gamma:[0x3b3,'g'],delta:[0x3b4,'d'],epsilon:[0x3b5,'e'],varepsilon:[0x3b5,'e'],zeta:[0x3b6,'z'],eta:[0x3b7,'h'],theta:[0x3b8,'q'],vartheta:[0x3d1,'J'],iota:[0x3b9,'i'],kappa:[0x3ba,'k'],lambda:[0x3bb,'l'],mu:[0x3bc,'m'],nu:[0x3bd,'n'],xi:[0x3be,'x'],pi:[0x3c0,'p'],rho:[0x3c1,'r'],sigma:[0x3c3,'s'],varsigma:[0x3c2,'V'],tau:[0x3c4,'t'],upsilon:[0x3c5,'u'],varphi:[0x3c6,'f'],phi:[0x3d5,'j'],chi:[0x3c7,'c'],psi:[0x3c8,'y'],omega:[0x3c9,'w']},
GRU={Gamma:[0x393,'G'],Delta:[0x394,'D'],Theta:[0x398,'Q'],Lambda:[0x39b,'L'],Xi:[0x39e,'X'],Pi:[0x3a0,'P'],Sigma:[0x3a3,'S'],Upsilon:[0x3a5,'U'],Phi:[0x3a6,'F'],Psi:[0x3a8,'Y'],Omega:[0x3a9,'W']},
SYT={pm:[0xb1,0xb1],times:[0xd7,0xb4],div:[0xf7,0xb8],cdot:[0x22c5,0xd7],le:[0x2264,0xa3],leq:[0x2264,0xa3],ge:[0x2265,0xb3],geq:[0x2265,0xb3],ne:[0x2260,0xb9],neq:[0x2260,0xb9],approx:[0x2248,0xbb],equiv:[0x2261,0xba],propto:[0x221d,0xb5],infty:[0x221e,0xa5],in:[0x2208,0xce],subset:[0x2282,0xcc],cup:[0x222a,0xc8],cap:[0x2229,0xc7],to:[0x2192,0xae],rightarrow:[0x2192,0xae],leftarrow:[0x2190,0xac],Rightarrow:[0x21d2,0xde],Leftrightarrow:[0x21d4,0xdb],partial:[0x2202,0xb6],nabla:[0x2207,0xd1],forall:[0x2200,0x22],exists:[0x2203,0x24],sim:[0x223c,0x7e],ldots:[0x2026,0xbc],circ:[0x2218,null],sum:[0x2211,0xe5],prod:[0x220f,0xd5],int:[0x222b,0xf2]},
FNS='sin cos tan cot sec csc arcsin arccos arctan sinh cosh tanh log ln lg exp lim max min sup inf det dim gcd mod'.split(' '),
FD={'(':[1,0x28,0x28],')':[1,0x29,0x29],'[':[3,0x5b,0x5b],']':[3,0x5d,0x5d],'\\{':[2,0x7b,0x7b],'\\}':[2,0x7d,0x7d],'|':[4,0x7c,0x7c],'\\|':[5,0x2016,null],'\\langle':[0,0x2329,0xe1],'\\rangle':[0,0x232a,0xf1],'\\lfloor':[6,0x230a,null],'\\rfloor':[6,0x230b,null],'\\lceil':[7,0x2308,null],'\\rceil':[7,0x2309,null]},
ACC={vec:11,hat:9,widehat:9,tilde:8,widetilde:8,bar:17,dot:2,ddot:3};
function texToMtef(src,HEAD){
 const T=[];
 for(let i=0;i<src.length;){const c=src[i];
  if(c==='\\'){let j=i+1;if(/[a-zA-Z]/.test(src[j]||''))while(/[a-zA-Z]/.test(src[j]||''))j++;else j++;T.push(src.slice(i,j));i=j;}
  else if(/\s/.test(c)){while(/\s/.test(src[i]||'')&&i<src.length)i++;T.push(' ');}
  else{T.push(c);i++;}}

  for(;;){const t=T[p++];if(t===undefined)throw new Error('Missing }');
