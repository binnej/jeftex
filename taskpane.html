<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script>
/* Math font: chosen in the pane, stored in localStorage, applied by reloading the pane
   (MathJax reads its font from the configuration below before it starts). */
const MJV='4.1.3',DEF_FONT='mathjax-tex',
FONTS=[['mathjax-tex','MathJax TeX (classic)'],['mathjax-newcm','New Computer Modern'],['mathjax-modern','Latin Modern'],
['mathjax-termes','Termes (Times-like)'],['mathjax-stix2','STIX Two (Times-like)'],['mathjax-pagella','Pagella (Palatino-like)'],
['mathjax-bonum','Bonum (Bookman-like)'],['mathjax-schola','Schola (Century Schoolbook-like)'],['mathjax-asana','Asana'],['mathjax-fira','Fira (sans-serif)']];
let FONT=DEF_FONT;try{const f=localStorage.getItem('jeftex.font');if(FONTS.some(x=>x[0]===f))FONT=f;}catch(e){}
let MJFAIL=null;  /* MathJax's loader reports a missing font file as an uncaught error and then never finishes */
addEventListener('error',e=>{if(/Can.t load/.test(e.message||''))MJFAIL=e.message;});
addEventListener('unhandledrejection',e=>{const m=String(e.reason&&e.reason.message||e.reason||'');if(/Can.t load/.test(m))MJFAIL=m;});
window.MathJax={output:{font:FONT,fontPath:'https://cdn.jsdelivr.net/npm/@mathjax/%%FONT%%-font@'+MJV},
 svg:{fontCache:'none',linebreaks:{inline:false}},startup:{typeset:false}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-svg.js"></script>
<style>
:root{--bg:#fff;--fg:#1b1b1b;--ac:#1f5fbf;--bd:#c8c8c8;--hv:#e8f0fc}
@media(prefers-color-scheme:dark){:root{--bg:#1e1e1e;--fg:#eee;--ac:#5b9bff;--bd:#555;--hv:#2c3a52}}
body{font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:12px}
textarea{width:100%;box-sizing:border-box;font:13px ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--bd);padding:6px}

#hd{margin-bottom:10px}#hd img{display:block;max-height:64px;height:auto;width:auto;max-width:100%}

<script>
const EMPX=16,W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',
PK='http://schemas.microsoft.com/office/2006/xmlPackage',
RT='http://schemas.openxmlformats.org/officeDocument/2006/relationships',
PR='http://schemas.openxmlformats.org/package/2006/relationships';
const $=id=>document.getElementById(id),say=t=>$('msg').textContent=t;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* MathJax 4 loads its font asynchronously: wait for it before converting */
const mj=async t=>{await MathJax.startup.promise;return MathJax.tex2svgPromise(t,{display:false});};
const b64=s=>btoa(unescape(encodeURIComponent(s)));

/* ---------- LaTeX -> SVG (+PNG fallback) ---------- */
const PNGDPI=600;  /* resolution of the PNG fallback (w and h are in 96-dpi pixels) */
function toPng(svg,w,h){return new Promise((ok,no)=>{const i=new Image();
 i.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(w*PNGDPI/96);c.height=Math.round(h*PNGDPI/96);
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/png').split(',')[1]);};
 i.onerror=()=>no(new Error('PNG fallback failed'));
 i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
/* Make the SVG easy for Word's own SVG renderer: Word silently falls back to the PNG when it cannot
   parse the SVG, and then the equation looks pixelated when zoomed. So: no nested <svg> (stretchy
   overlines, braces, ... become <g transform> + clip-path) and no MathJax accessibility metadata. */
function wordSvg(root){
 const NS='http://www.w3.org/2000/svg',mk=t=>document.createElementNS(NS,t);let n=0;
 for(const e of [...root.querySelectorAll('svg')]){
  const x=parseFloat(e.getAttribute('x'))||0,y=parseFloat(e.getAttribute('y'))||0,w=parseFloat(e.getAttribute('width')),h=parseFloat(e.getAttribute('height')),
   vb=(e.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number),g=mk('g'),out=mk('g'),cp=mk('clipPath'),r=mk('rect'),id='clp'+(n++);
  if(vb.length===4&&w>0&&h>0&&vb.every(isFinite))
   g.setAttribute('transform','translate('+x+' '+y+') scale('+w/vb[2]+' '+h/vb[3]+') translate('+(-vb[0])+' '+(-vb[1])+')');
  else g.setAttribute('transform','translate('+x+' '+y+')');
  while(e.firstChild)g.appendChild(e.firstChild);
  cp.setAttribute('id',id);for(const[k,v]of[['x',x],['y',y],['width',w||0],['height',h||0]])r.setAttribute(k,v);cp.appendChild(r);
  out.setAttribute('clip-path','url(#'+id+')');out.appendChild(g);e.replaceWith(cp,out);}
 /* table rules/frames get their width from MathJax's stylesheet, which a standalone SVG does not have */
 for(const e of root.querySelectorAll('line[data-line],rect[data-frame]')){e.setAttribute('stroke-width','70');e.setAttribute('fill','none');}
 for(const e of root.querySelectorAll('.mjx-dashed'))e.setAttribute('stroke-dasharray','140');
 for(const e of root.querySelectorAll('.mjx-dotted')){e.setAttribute('stroke-linecap','round');e.setAttribute('stroke-dasharray','0,140');}
 for(const e of [root,...root.querySelectorAll('*')]){
  for(const a of [...e.attributes])if(/^(data-|aria-)/.test(a.name)||['role','focusable','style','interpret-as','time','pitch','rate','kind'].includes(a.name))e.removeAttribute(a.name);}
 return root;}
/* Fractions/binomials always in display style, so nested fractions keep full size.
   The stored TeX (alt text) is left untouched; only the rendering is adjusted. */
const PAD=3,norm=t=>t.replace(/\\(?:frac|tfrac)(?![a-zA-Z])/g,'\\dfrac').replace(/\\binom(?![a-zA-Z])/g,'\\dbinom');
async function render(tex){
 const n=await mj(norm(tex)),s=n.querySelector('svg');
 if(s.querySelector('[data-mml-node="merror"]'))throw new Error('Invalid LaTeX');
 const vb=s.getAttribute('viewBox').split(/[\s,]+/).map(Number),
  upx=vb[2]/parseFloat(s.getAttribute('width')),  /* font units per ex: differs per font */
  K=EMPX/1000,                                    /* px per font unit: 1 em = EMPX px in every font */
  w0=vb[2]*K,h0=vb[3]*K,vaPx=(parseFloat(s.style.verticalAlign)||0)*upx*K,
  pu=PAD/K,box=[vb[0]-pu,vb[1]-pu,vb[2]+2*pu,vb[3]+2*pu],
  w=Math.round(w0)+2*PAD,h=Math.round(h0)+2*PAD;
 /* near-invisible background box: makes the whole rectangle clickable in Word */
 s.setAttribute('viewBox',box.join(' '));
 const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
 bg.setAttribute('x',box[0]);bg.setAttribute('y',box[1]);bg.setAttribute('width',box[2]);bg.setAttribute('height',box[3]);
 bg.setAttribute('fill','#ffffff');bg.setAttribute('fill-opacity','0.01');
 s.insertBefore(bg,s.firstChild);
 s.setAttribute('width',w+'px');s.setAttribute('height',h+'px');s.removeAttribute('style');
 const svg=new XMLSerializer().serializeToString(wordSvg(s)).replace(/currentColor/g,'#000000');
 return{svg,png:await toPng(svg,w,h),w,h,pos:Math.round((vaPx-PAD)*1.5)};
}

/* ---------- OOXML helpers ---------- */
function drawing(tex,w,h,id,rp,rs){const cx=w*9525,cy=h*9525;
 return `<w:drawing xmlns:w="${W}" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" xmlns:r="${RT}"><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="TexEq${id}" descr="${esc('TEX:'+tex)}"/><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="0" name="eq.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rp}"><a:extLst><a:ext uri="{96DAC541-7B7A-43D3-8B79-37D633B846F1}"><asvg:svgBlip xmlns:asvg="http://schemas.microsoft.com/office/drawing/2016/SVG/main" r:embed="${rs}"/></a:ext></a:extLst></a:blip><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing>`;}
const part=(n,t,x,bin)=>`<pkg:part pkg:name="${n}" pkg:contentType="${t}"${bin?' pkg:compression="store"':''}>${bin?`<pkg:binaryData>${x}</pkg:binaryData>`:`<pkg:xmlData>${x}</pkg:xmlData>`}</pkg:part>`;
const imgParts=(k,r)=>part(`/word/media/eq${k}.png`,'image/png',r.png,1)+part(`/word/media/eq${k}.svg`,'image/svg+xml',b64(r.svg),1);
function pkgFor(r,tex){
 const rels=`<Relationships xmlns="${PR}"><Relationship Id="rIdP" Type="${RT}/image" Target="media/eqx.png"/><Relationship Id="rIdS" Type="${RT}/image" Target="media/eqx.svg"/></Relationships>`;
 const run=`<w:r>${r.pos?`<w:rPr><w:position w:val="${r.pos}"/></w:rPr>`:''}${drawing(tex,r.w,r.h,Date.now()%1e6,'rIdP','rIdS')}</w:r>`;
 return `<pkg:package xmlns:pkg="${PK}">`
  +part('/_rels/.rels','application/vnd.openxmlformats-package.relationships+xml',`<Relationships xmlns="${PR}"><Relationship Id="rId1" Type="${RT}/officeDocument" Target="word/document.xml"/></Relationships>`)
  +part('/word/_rels/document.xml.rels','application/vnd.openxmlformats-package.relationships+xml',rels)
  +part('/word/document.xml','application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml',`<w:document xmlns:w="${W}"><w:body><w:p>${run}</w:p></w:body></w:document>`)
  +part('/word/media/eqx.png','image/png',r.png,1)+part('/word/media/eqx.svg','image/svg+xml',b64(r.svg),1)+'</pkg:package>';}

/* ---------- MTEF v5 (MathType binary) -> LaTeX, best effort ---------- */
const G=['alpha','beta','gamma','delta','varepsilon','zeta','eta','theta','iota','kappa','lambda','mu','nu','xi','o','pi','rho','varsigma','sigma','tau','upsilon','varphi','chi','psi','omega'],
GU=['A','B','\\Gamma','\\Delta','E','Z','H','\\Theta','I','K','\\Lambda','M','N','\\Xi','O','\\Pi','P','','\\Sigma','T','\\Upsilon','\\Phi','X','\\Psi','\\Omega'],
SYM={0xb1:'\\pm',0xd7:'\\times',0xf7:'\\div',0x2264:'\\le',0x2265:'\\ge',0x2260:'\\ne',0x2248:'\\approx',0x221e:'\\infty',0x2192:'\\to',0x2190:'\\leftarrow',0x21d2:'\\Rightarrow',0x2211:'\\sum',0x220f:'\\prod',0x222b:'\\int',0x2202:'\\partial',0x2212:'-',0x22c5:'\\cdot',0x2026:'\\ldots',0x2208:'\\in',0x2207:'\\nabla',0x2200:'\\forall',0x2203:'\\exists',0x222a:'\\cup',0x2229:'\\cap',0x2218:'\\circ',0x3d5:'\\phi',0x2261:'\\equiv',0x221d:'\\propto',0x2282:'\\subset',0x21d4:'\\Leftrightarrow',0xb0:'^\\circ',0x2032:"'",0x221a:'\\surd'},
ESC={9:'\\qquad ',123:'\\{',125:'\\}',92:'\\backslash',95:'\\_',94:'\\^{}',37:'\\%',38:'\\&',35:'\\#',36:'\\$',126:'\\sim'};
function ch(c){let r;
 if(c>=0x3b1&&c<=0x3c9)r=G[c-0x3b1]==='o'?'o':'\\'+G[c-0x3b1];
 else if(c>=0x391&&c<=0x3a9&&GU[c-0x391])r=GU[c-0x391];
 else r=SYM[c]||ESC[c]||String.fromCodePoint(c||63);
 return /^\\[a-zA-Z]+$/.test(r)?r+' ':r;}
const EMB={2:'dot',3:'ddot',4:'dddot',8:'tilde',9:'hat',11:'vec',16:'bar',17:'bar'};
function tmpl(s,v,c){const g=n=>c[n]||'',
 FEN={0:['\\langle','\\rangle'],1:['(',')'],2:['\\{','\\}'],3:['[',']'],4:['|','|'],5:['\\|','\\|'],6:['\\lfloor','\\rfloor'],7:['\\lceil','\\rceil'],8:['[',')'],9:['(',']']},
 OP={15:'\\int',16:'\\sum',17:'\\prod',18:'\\coprod',19:'\\bigcup',20:'\\bigcap'};
 if(FEN[s])return'\\left'+(v&1?FEN[s][0]:'.')+' '+g(0)+' \\right'+(v&2?FEN[s][1]:'.')+' ';
 if(OP[s])return OP[s]+(s>15?'\\limits':'')+(g(1)?'_{'+g(1)+'}':'')+(g(2)?'^{'+g(2)+'}':'')+' '+g(0);
 switch(s){
  case 10:return g(1)?`\\sqrt[${g(1)}]{${g(0)}}`:`\\sqrt{${g(0)}}`;
  case 11:return`{\\frac{${g(0)}}{${g(1)}}}`;
  case 12:return`\\underline{${g(0)}}`;case 13:return`\\overline{${g(0)}}`;
  case 14:return`\\xrightarrow[${g(1)}]{${g(0)}}`;
  case 23:return`\\mathop{${g(0)}}\\limits`+(g(1)?`_{${g(1)}}`:'')+(g(2)?`^{${g(2)}}`:'');
  case 24:return v&1?`\\underbrace{${g(0)}}_{${g(1)}}`:`\\overbrace{${g(0)}}^{${g(1)}}`;
  case 27:return`_{${g(0)||g(1)}}`;
  case 28:return`^{${g(1)||g(0)}}`;
  case 29:return`_{${g(0)}}^{${g(1)}}`;
  case 31:return`\\vec{${g(0)}}`;case 32:return`\\widetilde{${g(0)}}`;case 33:return`\\widehat{${g(0)}}`;
  case 37:return`\\boxed{${g(0)}}`;}
 return c.join(' ');}
function mtefToTex(b){
 let i=b[0]|b[1]<<8;
 if(b[i]!==5)throw new Error('Unsupported MTEF version '+b[i]+' (only MathType 4+ / MTEF 5 is supported)');
 i+=5;while(b[i++]);i++;                        // header: 5 bytes, app key\0, options
 const u8=()=>b[i++],
 nud=()=>{const x=u8(),y=u8();if(x==128&&y==128)i+=4;},
 arr=()=>{let n=u8(),h=0;while(n>0){const x=b[i],nb=h?x&15:x>>4;if(h)i++;h^=1;if(nb==15)n--;}if(h)i++;},
 join=a=>{let o='',r='',m=0;const f=()=>{if(r){o+=(m==1?'\\text{':m==2?'\\mathrm{':'\\mathbf{')+r+'}';r='';}};
  for(const x of a){const k=x.f==1?1:x.f==2?2:x.f==7?3:0;
   if(k){if(m!=k)f();m=k;r+=x.t!=null?x.t:x.s;}else{f();m=0;o+=x.s;}}f();return o;};
 function list(){const a=[];
  while(i<b.length){const t=u8();
   switch(t){
    case 0:return a;
    case 1:{const o=u8();if(o&8)nud();if(o&4)i+=2;a.push({s:o&1?'':join(list())});break;}
    case 2:{const o=u8();if(o&8)nud();const f=u8()-128;let c=0,c8=0,c16=0;
     if(!(o&32))c=u8()|u8()<<8;if(o&4)c8=u8();if(o&16)c16=u8()|u8()<<8;
     c=c||c16||c8;let s=ch(c),pr='';
     if(o&1)for(;;){const e=u8();if(e==0)break;const eo=u8();if(eo&8)nud();const k=u8();
      if(k==5)pr+="'";else if(k==6)pr+="''";else if(EMB[k])s=`\\${EMB[k]}{${s}}`;}
     const raw=String.fromCodePoint(c||63);
     a.push({s:s+pr,f,t:/^[\x20-\x7e]$/.test(raw)&&!ESC[c]?raw:s});break;}
    case 3:{const o=u8();if(o&8)nud();const sel=u8();let v=u8();if(v&128)v=(v&127)|u8()<<8;u8();
     a.push({s:tmpl(sel,v,list().map(x=>x.s))});break;}
    case 4:{const o=u8();if(o&8)nud();i+=2;a.push({s:'\\begin{matrix}'+list().map(x=>x.s).join('\\\\')+'\\end{matrix}'});break;}
    case 5:{const o=u8();if(o&8)nud();i+=3;const R=u8(),C=u8();i+=Math.ceil((R+1)/4)+Math.ceil((C+1)/4);
     const k=list().map(x=>x.s),rows=[];for(let r=0;r<R;r++)rows.push(k.slice(r*C,r*C+C).join('&'));
     a.push({s:'\\begin{matrix}'+rows.join('\\\\')+'\\end{matrix}'});break;}
    case 6:{const o=u8();if(o&8)nud();i++;break;}
    case 7:i+=3*u8();break;
    case 8:i+=2;break;
    case 9:i+=u8()==101?2:1;break;
    case 10:case 11:case 12:case 13:case 14:break;
    case 15:i++;break;
    case 16:{const o=u8();i+=o&1?8:6;if(o&4)while(b[i++]);break;}
    case 17:i++;while(b[i++]);break;
    case 18:{i++;arr();arr();let n=u8();while(n--)if(u8())i++;break;}
    case 19:while(b[i++]);break;
    default:throw new Error('Unhandled MTEF record '+t+' at byte '+(i-1));}}
  return a;}
 return join(list());}

/* ---------- Convert MathType objects inside an OOXML package ---------- */
async function convertOoxml(x){
 const d=new DOMParser().parseFromString(x,'application/xml'),P={};
 for(const p of d.getElementsByTagName('pkg:part'))P[p.getAttribute('pkg:name')]=p;
 const rel=P['/word/_rels/document.xml.rels'].getElementsByTagName('Relationships')[0],map={};
 for(const r of rel.getElementsByTagName('Relationship'))map[r.getAttribute('Id')]=r.getAttribute('Target');
 let n=0;const errs=[],id0=Date.now()%1e6,all=[...d.getElementsByTagName('o:OLEObject')];
 if(!all.length)errs.push('no embedded OLE objects found in the selection');
 for(const o of all){
  if(!/^Equation\.(DSMT|3)/.test(o.getAttribute('ProgID')||'')){errs.push('skipped '+o.getAttribute('ProgID'));continue;}
  try{
   const bin=P['/word/'+map[o.getAttribute('r:id')]].getElementsByTagName('pkg:binaryData')[0].textContent.replace(/\s/g,'');
   const f=CFB.find(CFB.read(Uint8Array.from(atob(bin),c=>c.charCodeAt(0)),{type:'array'}),'Equation Native');
   const tex=mtefToTex(f.content),r=await render(tex),k=n;
   let ob=o;while(ob&&ob.nodeName!=='w:object')ob=ob.parentNode;
   const dr=new DOMParser().parseFromString(drawing(tex,r.w,r.h,id0+k,'rIdEP'+k,'rIdES'+k),'application/xml').documentElement;
   const nd=d.importNode(dr,true),rr=ob.parentNode;rr.replaceChild(nd,ob);
   if(r.pos&&rr.nodeName==='w:r'){let rp=[...rr.childNodes].find(q=>q.nodeName==='w:rPr');
    if(!rp){rp=d.createElementNS(W,'w:rPr');rr.insertBefore(rp,rr.firstChild);}
    const ps=d.createElementNS(W,'w:position');ps.setAttributeNS(W,'w:val',String(r.pos));
    const nx=[...rp.childNodes].find(q=>/^w:(sz|szCs|highlight|u|effect|bdr|shd|fitText|vertAlign|rtl|cs|em|lang|eastAsianLayout|specVanish|oMath)$/.test(q.nodeName));
    rp.insertBefore(ps,nx||null);}
   for(const[idn,ext]of[['rIdEP'+k,'png'],['rIdES'+k,'svg']]){
    const e=d.createElementNS(rel.namespaceURI,'Relationship');
    e.setAttribute('Id',idn);e.setAttribute('Type',RT+'/image');e.setAttribute('Target',`media/eq${k}.${ext}`);rel.appendChild(e);}
   const add=new DOMParser().parseFromString(`<pkg:package xmlns:pkg="${PK}">${imgParts(k,r)}</pkg:package>`,'application/xml');
   for(const c of [...add.documentElement.children])d.documentElement.appendChild(d.importNode(c,true));
   n++;
  }catch(e){errs.push(e.message);console.error(e);}
 }
 return{xml:new XMLSerializer().serializeToString(d),n,errs};

/* OOXML with a Word equation -> plugin picture(s) */
async function convertOmml(x){
 const d=new DOMParser().parseFromString(x,'application/xml'),P={};
 for(const p of d.getElementsByTagName('pkg:part'))P[p.getAttribute('pkg:name')]=p;
 const rel=P['/word/_rels/document.xml.rels'].getElementsByTagName('Relationships')[0];
 const units=[...d.getElementsByTagNameNS(MNS,'oMathPara'),...[...d.getElementsByTagNameNS(MNS,'oMath')].filter(m=>!m.parentNode||oLN(m.parentNode)!=='oMathPara')];
 let n=0;const errs=[],id0=Date.now()%1e6;
 if(!units.length)errs.push('no Word equations found');
 for(const u of units){
  try{const ms=oLN(u)==='oMathPara'?oKids(u).filter(k=>oLN(k)==='oMath'):[u],runs=[];
   for(const m of ms){const tex=ommlToTex(m);if(!tex)continue;const r=await render(tex),k=n+runs.length;
    runs.push({tex,r,k});}
   if(!runs.length)continue;
   const par=u.parentNode,frag=[];
   runs.forEach((o,i)=>{if(i)frag.push(`<w:r xmlns:w="${W}"><w:br/></w:r>`);
    frag.push(`<w:r xmlns:w="${W}">${o.r.pos?`<w:rPr><w:position w:val="${o.r.pos}"/></w:rPr>`:''}${drawing(o.tex,o.r.w,o.r.h,id0+o.k,'rIdWP'+o.k,'rIdWS'+o.k)}</w:r>`);});
   for(const s of frag)par.insertBefore(d.importNode(new DOMParser().parseFromString(s,'application/xml').documentElement,true),u);
   par.removeChild(u);
   for(const o of runs){
    for(const[idn,ext]of[['rIdWP'+o.k,'png'],['rIdWS'+o.k,'svg']]){const e=d.createElementNS(rel.namespaceURI,'Relationship');
     e.setAttribute('Id',idn);e.setAttribute('Type',RT+'/image');e.setAttribute('Target',`media/eqw${o.k}.${ext}`);rel.appendChild(e);}
    const add=new DOMParser().parseFromString(`<pkg:package xmlns:pkg="${PK}">${part(`/word/media/eqw${o.k}.png`,'image/png',o.r.png,1)+part(`/word/media/eqw${o.k}.svg`,'image/svg+xml',b64(o.r.svg),1)}</pkg:package>`,'application/xml');
    for(const c of [...add.documentElement.children])d.documentElement.appendChild(d.importNode(c,true));}
   if(oLN(u)==='oMathPara'&&par.nodeName==='w:p'){let pp=[...par.childNodes].find(q=>q.nodeName==='w:pPr');
    if(!pp){pp=d.createElementNS(W,'w:pPr');par.insertBefore(pp,par.firstChild);}
    if(![...pp.childNodes].some(q=>q.nodeName==='w:jc')){const jc=d.createElementNS(W,'w:jc');jc.setAttributeNS(W,'w:val','center');
     const nx=[...pp.childNodes].find(q=>/^w:(textDirection|textAlignment|textboxTightWrap|outlineLvl|divId|cnfStyle|rPr|sectPr|pPrChange)$/.test(q.nodeName));pp.insertBefore(jc,nx||null);}}
   n+=runs.length;
  }catch(e){errs.push(e.message);}}
 return{xml:new XMLSerializer().serializeToString(d),n,errs};}
/* first MathType object in an OOXML package -> LaTeX */
function oleTex(x){const d=new DOMParser().parseFromString(x,'application/xml'),P={};
 for(const p of d.getElementsByTagName('pkg:part'))P[p.getAttribute('pkg:name')]=p;
 const map={};for(const r of P['/word/_rels/document.xml.rels'].getElementsByTagName('Relationship'))map[r.getAttribute('Id')]=r.getAttribute('Target');
 for(const o of d.getElementsByTagName('o:OLEObject')){if(!/^Equation\.(DSMT|3)/.test(o.getAttribute('ProgID')||''))continue;
  const bin=P['/word/'+map[o.getAttribute('r:id')]].getElementsByTagName('pkg:binaryData')[0].textContent.replace(/\s/g,'');
  return mtefToTex(CFB.find(CFB.read(Uint8Array.from(atob(bin),c=>c.charCodeAt(0)),{type:'array'}),'Equation Native').content);}
 return null;}
/* what does the current selection hold? */
function fromOoxml(v,para){
 if(!para&&/Equation\.(DSMT|3)/.test(v)){try{const t=oleTex(v);if(t)return{tex:t,ctx:null,what:'MathType equation'};}
  catch(e){say('Could not read this MathType equation: '+e.message);return null;}}
 if(!/<m:oMath/.test(v))return null;
 const d=new DOMParser().parseFromString(v,'application/xml'),ms=[...d.getElementsByTagNameNS(MNS,'oMath')];
 if(!ms.length)return null;
 if(!para){const t=ommlToTex(ms[0]);return t?{tex:t,ctx:null,what:'Word equation'}:null;}
 if(ms.length!==1||[...d.getElementsByTagNameNS(W,'t')].some(t=>t.textContent.trim()))return null;
 const t=ommlToTex(ms[0]);return t?{tex:t,ctx:'para',what:'Word equation'}:null;}

/* ---------- UI ---------- */
let tmr;
async function preview(){try{$('prev').replaceChildren((await mj(norm($('tex').value||' '))).querySelector('svg'));}catch(e){}}
$('tex').oninput=()=>{clearTimeout(tmr);tmr=setTimeout(preview,250);};
const run=f=>async()=>{try{await f();}catch(e){say('Error: '+e.message);}};
/* Insert: put the equation in the document, leave the cursor after it, and clear the editor.
   Clicking an equation (plugin, MathType or Word) loads its LaTeX back into the editor. */
let quiet=0,ctx=null;
const clearEq=()=>{$('tex').value='';$('prev').replaceChildren();ctx=null;};
async function putEq(build){const para=ctx==='para',pkg=await build(),
  x=para?pkg.replace('<w:p><w:r>','<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r>'):pkg;
 quiet=Date.now()+3000;
 await Word.run(async c=>{const s=c.document.getSelection(),r=(para?s.paragraphs.getFirst():s).insertOoxml(x,'Replace');try{r.select('End');}catch(e){}await c.sync();});
 quiet=Date.now()+1000;clearEq();}
$('ins').onclick=run(async()=>{const t=$('tex').value.trim();if(!t)return;
 await putEq(async()=>pkgFor(await render(t),t));say('Inserted. Click the equation to edit it again.');});
$('insmt').onclick=run(async()=>{const t=$('tex').value.trim();if(!t)return;
 await putEq(async()=>pkgMT(await render(t),t));say('Inserted as MathType object. Click it to edit the LaTeX, double-click to edit in MathType.');});
/* MathType -> LaTeX (plugin equations) */
$('cs').onclick=run(async()=>{let r;
 await Word.run(async c=>{const s=c.document.getSelection(),ox=s.getOoxml();await c.sync();
  r=await convertOoxml(ox.value);if(r.n){s.insertOoxml(r.xml,'Replace');await c.sync();}});
 say(`Converted ${r.n}.`+(r.errs.length?'\nProblems: '+r.errs.join('; '):''));});
$('ca').onclick=run(async()=>{let tot=0,errs=[];
 await Word.run(async c=>{const ps=c.document.body.paragraphs;ps.load('items');await c.sync();
  const ox=ps.items.map(p=>p.getOoxml());await c.sync();
  for(let k=ps.items.length-1;k>=0;k--){
   if(!/Equation\.(DSMT|3)/.test(ox[k].value))continue;
   const r=await convertOoxml(ox[k].value);errs.push(...r.errs);
   if(r.n){ps.items[k].insertOoxml(r.xml,'Replace');await c.sync();tot+=r.n;}}});
 say(`Converted ${tot}. Check the result on a copy of your file.`+(errs.length?'\nProblems: '+errs.join('; '):''));});
/* LaTeX (plugin equations) -> MathType */
$('ts').onclick=run(async()=>{let r;
 await Word.run(async c=>{const s=c.document.getSelection(),ox=s.getOoxml();await c.sync();
  r=await toMathType(ox.value);if(r.n){s.insertOoxml(r.xml,'Replace');await c.sync();}});
 say(`Converted ${r.n} to MathType.`+(r.errs.length?'\nProblems: '+r.errs.join('; '):''));});
$('ta').onclick=run(async()=>{let tot=0,errs=[];
 await Word.run(async c=>{const ps=c.document.body.paragraphs;ps.load('items');await c.sync();
  const ox=ps.items.map(p=>p.getOoxml());await c.sync();
  for(let k=ps.items.length-1;k>=0;k--){
   if(!ox[k].value.includes('TEX:'))continue;
   const r=await toMathType(ox[k].value);errs.push(...r.errs);
   if(r.n){ps.items[k].insertOoxml(r.xml,'Replace');await c.sync();tot+=r.n;}}});
 say(`Converted ${tot} to MathType. Check the result on a copy of your file.`+(errs.length?'\nProblems: '+errs.join('; '):''));});
/* Word equation -> LaTeX (whole document) */
$('wa').onclick=run(async()=>{let tot=0,errs=[];
 await Word.run(async c=>{const ps=c.document.body.paragraphs;ps.load('items');await c.sync();
  const ox=ps.items.map(p=>p.getOoxml());await c.sync();
  for(let k=ps.items.length-1;k>=0;k--){
   if(!/<m:oMath/.test(ox[k].value))continue;
   const r=await convertOmml(ox[k].value);errs.push(...r.errs);
   if(r.n){ps.items[k].insertOoxml(r.xml,'Replace');await c.sync();tot+=r.n;}}});
 say(`Converted ${tot} Word equation(s). Check the result on a copy of your file.`+(errs.length?'\nProblems: '+errs.join('; '):''));});
/* Selection: load the LaTeX of the clicked equation into the editor */
let selT=0,selBusy=false;
function onSel(){clearTimeout(selT);selT=setTimeout(selWork,250);}
async function selWork(){if(Date.now()<quiet||selBusy)return;selBusy=true;
 try{let got=null;
  await Word.run(async c=>{const s=c.document.getSelection(),pics=s.inlinePictures;
   pics.load('items/altTextDescription');s.load('isEmpty');await c.sync();
   const a=pics.items[0]?.altTextDescription||'';
   if(a.startsWith('TEX:')){got={tex:a.slice(4),ctx:null,what:'plugin equation'};return;}
   const ox=s.isEmpty?s.paragraphs.getFirst().getOoxml():s.getOoxml();await c.sync();
   got=fromOoxml(ox.value,s.isEmpty);});
  if(got){if(Date.now()>=quiet){$('tex').value=got.tex;ctx=got.ctx;preview();say(`Loaded ${got.what}. Edit it and press Insert to replace it.`);}}
  else ctx=null;
 }catch(e){}finally{selBusy=false;}}
/* Font selector: store the choice, keep the editor content, reload the pane with the new font */
const FS=$('fnt');
for(const[v,l]of FONTS){const o=document.createElement('option');o.value=v;o.textContent=l;FS.appendChild(o);}
FS.value=FONT;
FS.onchange=()=>{try{localStorage.setItem('jeftex.font',FS.value);
  if(localStorage.getItem('jeftex.font')!==FS.value)throw 0;
  sessionStorage.setItem('jeftex.keep',JSON.stringify({tex:$('tex').value,tab,ctx}));
 }catch(e){FS.value=FONT;say('Could not save the font choice (browser storage is blocked).');return;}
 location.reload();};
const fontName=()=>(FONTS.find(x=>x[0]===FONT)||[,FONT])[1];
Office.onReady(async()=>{
 try{await new Promise((ok,no)=>{const t0=Date.now(),iv=setInterval(()=>{
   if(MJFAIL){clearInterval(iv);no(new Error(MJFAIL));}else if(Date.now()-t0>20000){clearInterval(iv);no(new Error('timeout'));}},150);
  MathJax.startup.promise.then(()=>MathJax.tex2svgPromise('x')).then(()=>{clearInterval(iv);ok();},e=>{clearInterval(iv);no(e);});});}
 catch(e){
  if(FONT!==DEF_FONT){try{localStorage.removeItem('jeftex.font');}catch(_){}
   try{sessionStorage.setItem('jeftex.msg','Could not load the font "'+fontName()+'". Back to the default font.');}catch(_){}
   location.reload();return;}
  say('MathJax could not be loaded: '+(e&&e.message||e));return;}
 try{const k=JSON.parse(sessionStorage.getItem('jeftex.keep')||'null');sessionStorage.removeItem('jeftex.keep');
  if(k){$('tex').value=k.tex||'';ctx=k.ctx||null;if(PAL[k.tab])tab=k.tab;}
  const m=sessionStorage.getItem('jeftex.msg');if(m){sessionStorage.removeItem('jeftex.msg');say(m);}}catch(e){}
 buildTabs();if($('tex').value)preview();
 Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged,onSel);});
</script></body></html>
